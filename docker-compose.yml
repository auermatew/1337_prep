name: 1337test
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasks
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tasks']
      interval: 2s
      timeout: 3s
      retries: 30

  # Two backend processes against the same Postgres: `docker compose --profile multi up -d --build`
  backend-1: &backend
    profiles: [multi]
    image: 1337test-backend
    build: ./backend
    init: true
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tasks
      PORT: '3000'
      FRONTEND_ORIGIN: http://localhost:5173
      STREAM_KEEPALIVE_MS: '15000'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3001:3000'

  backend-2:
    <<: *backend
    ports:
      - '3002:3000'

volumes:
  pgdata:
