# Test, build both images into GHCR, then deploy them to the Droplet over SSH.
# One-time setup (Droplet, secrets, variables): deploy/README.md.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/auermatew/1337_prep

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend
        working-directory: backend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
    steps:
      - name: Check setup
        run: |
          missing=()
          [ -n "$DROPLET_HOST" ] || missing+=(secret:DROPLET_HOST)
          [ "${{ secrets.DROPLET_SSH_KEY != '' }}" = true ] || missing+=(secret:DROPLET_SSH_KEY)
          [ "${{ secrets.DROPLET_KNOWN_HOSTS != '' }}" = true ] || missing+=(secret:DROPLET_KNOWN_HOSTS)
          [ "${{ secrets.POSTGRES_PASSWORD != '' }}" = true ] || missing+=(secret:POSTGRES_PASSWORD)
          [ -n "$SITE_ADDRESS" ] || missing+=(variable:SITE_ADDRESS)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Droplet deploy is not set up yet, missing ${missing[*]}. See deploy/README.md."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key: never trust whatever answers on the IP.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host droplet\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' \
            "$DROPLET_HOST" > ~/.ssh/config

      - name: Upload compose file and .env
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'tasks' }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'tasks' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          ssh droplet 'cat > /opt/1337/compose.yml' < deploy/compose.prod.yml
          # Secrets go over stdin, never onto a command line.
          {
            printf 'POSTGRES_USER=%s\n' "$POSTGRES_USER"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'POSTGRES_DB=%s\n' "$POSTGRES_DB"
            printf 'SITE_ADDRESS=%s\n' "$SITE_ADDRESS"
            printf 'IMAGE_PREFIX=%s\n' "$IMAGE_PREFIX"
            printf 'IMAGE_TAG=%s\n' "$GITHUB_SHA"
          } | ssh droplet 'umask 077 && cat > /opt/1337/.env'

      - name: Pull and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The job token expires when the job ends; log out anyway so it isn't left on disk.
          printf '%s' "$GHCR_TOKEN" | ssh droplet "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh droplet 'set -e; cd /opt/1337; trap "docker logout ghcr.io >/dev/null" EXIT
            docker compose pull
            docker compose up -d --wait --remove-orphans
            docker image prune -f'

      - name: Smoke check
        run: |
          # The first deploy waits on Let's Encrypt, so retry for about two minutes.
          for _ in $(seq 1 24); do
            if curl -fsS --max-time 5 "https://$SITE_ADDRESS/api"; then echo; exit 0; fi
            sleep 5
          done
          echo "::error::https://$SITE_ADDRESS/api did not answer"
          ssh droplet 'cd /opt/1337 && docker compose ps && docker compose logs --tail 50'
          exit 1
