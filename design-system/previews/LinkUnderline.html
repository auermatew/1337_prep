<!-- @dsCard group="Motion" height=150 subtitle="Hover: 2px underline grows via background-size, 0.3s on the 1337 ease" -->
<!doctype html><html><head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"><style>html,body{margin:0;background:var(--paper);color:var(--ink)}.wrap{padding:20px 24px;font-family:var(--font-sans)}.tag{font:500 11.5px/1 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}button.replay{font:500 11.5px/1 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;background:none;border:1.5px solid var(--ink);color:var(--ink);padding:9px 12px;border-radius:0;cursor:pointer}button.replay:focus-visible{outline:2px solid var(--purple);outline-offset:2px}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
nav{display:flex;flex-wrap:wrap;gap:28px;margin-top:20px}
nav a{color:var(--ink);text-decoration:none;font:500 11.5px/1 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;padding:7px 0;background:linear-gradient(var(--purple),var(--purple)) 0 100%/0 2px no-repeat;transition:background-size .3s cubic-bezier(.2,.7,.2,1)}
nav a:hover,nav a:focus-visible{background-size:100% 2px;outline:none}nav a.on{background-size:100% 2px}
</style></head><body><div class="wrap"><span class="tag">Hover a link</span>
<nav><a href="#" class="on">Platform</a><a href="#">Rollout</a><a href="#">Team</a><a href="#">References</a><a href="#">Careers</a></nav></div>
<script>document.querySelectorAll('nav a').forEach(a=>a.addEventListener('click',e=>e.preventDefault()))</script></body></html>
