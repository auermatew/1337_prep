<!-- @dsCard group="Motion" height=200 subtitle="steps(n) typing at 24ms per char, orange block cursor blinking steps(1) 1.05s" -->
<!doctype html><html><head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"><style>html,body{margin:0;background:var(--paper);color:var(--ink)}.wrap{padding:20px 24px;font-family:var(--font-sans)}.tag{font:500 11.5px/1 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}button.replay{font:500 11.5px/1 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;background:none;border:1.5px solid var(--ink);color:var(--ink);padding:9px 12px;border-radius:0;cursor:pointer}button.replay:focus-visible{outline:2px solid var(--purple);outline-offset:2px}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.term{margin-top:16px;border:1.5px solid var(--ink);background:var(--paper-raised);padding:16px 18px;font:500 14px/1.35 var(--font-mono);display:flex;flex-direction:column;gap:8px}
.ln{display:flex;align-items:baseline;gap:10px}.type{display:inline-block;overflow:hidden;white-space:nowrap;width:calc(var(--n)*1ch)}
.go .type{animation:type calc(var(--n)*24ms) steps(var(--n),end) both}.go .ln:nth-child(2) .type{animation-delay:.7s}
.ok{margin-left:auto;color:var(--muted)}
.cur{display:inline-block;width:.6em;height:1.1em;background:var(--orange);vertical-align:-.2em;animation:blink 1.05s steps(1) infinite}
@keyframes type{from{width:0}to{width:calc(var(--n)*1ch)}}@keyframes blink{50%{opacity:0}}
</style></head><body><div class="wrap"><div class="row"><span class="tag">Terminal boot</span><button class="replay" id="b">Replay</button></div>
<div class="term go" id="t"><div class="ln"><span class="type" style="--n:27">&gt; load knowledge --scope=hr</span><span class="ok">OK</span></div><div class="ln"><span class="type" style="--n:21">&gt; route data-guard on</span><span class="ok">OK</span></div><div class="ln"><span>&gt;</span><span class="cur"></span></div></div></div>
<script>function replay(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)};document.getElementById('b').onclick=()=>replay(document.getElementById('t'),'go')</script></body></html>
