<!-- @dsCard group="Motion" height=220 subtitle="opacity + 18px rise, 0.7s ease" -->
<!doctype html><html><head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"><style>html,body{margin:0;background:var(--paper);color:var(--ink)}.wrap{padding:20px 24px;font-family:var(--font-sans)}.tag{font:500 11.5px/1 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}button.replay{font:500 11.5px/1 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;background:none;border:1.5px solid var(--ink);color:var(--ink);padding:9px 12px;border-radius:0;cursor:pointer}button.replay:focus-visible{outline:2px solid var(--purple);outline-offset:2px}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.rv{opacity:1;transform:none}.go .rv{animation:rv .7s ease both}.go .rv:nth-child(2){animation-delay:.12s}.go .rv:nth-child(3){animation-delay:.24s}
@keyframes rv{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:16px}h2{margin:0;font-family:var(--font-display);font-weight:200;font-size:40px;line-height:1.05;letter-spacing:-.022em}p{margin:0;font-size:15px;line-height:1.7;color:var(--ink-soft);max-width:52ch}
</style></head><body><div class="wrap"><div class="row"><span class="tag">.rv → .rv.in</span><button class="replay" id="b">Replay</button></div>
<div class="stack go" id="s"><span class="tag rv">Platform</span><h2 class="rv">One AI platform for the whole company.</h2><p class="rv">Each block rises 18px and fades in as it enters the viewport.</p></div></div>
<script>function replay(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)};document.getElementById('b').onclick=()=>replay(document.getElementById('s'),'go')</script></body></html>
