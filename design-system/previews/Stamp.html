<!-- @dsCard group="Motion" height=220 subtitle="rotate(-13deg), scale 1.4 → 0.95 → 1, 0.55s on the 1337 ease" -->
<!doctype html><html><head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"><style>html,body{margin:0;background:var(--paper);color:var(--ink)}.wrap{padding:20px 24px;font-family:var(--font-sans)}.tag{font:500 11.5px/1 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}button.replay{font:500 11.5px/1 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;background:none;border:1.5px solid var(--ink);color:var(--ink);padding:9px 12px;border-radius:0;cursor:pointer}button.replay:focus-visible{outline:2px solid var(--purple);outline-offset:2px}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.doc{position:relative;margin-top:16px;border:1.5px solid var(--ink);background:var(--paper-raised);padding:18px 20px;min-height:96px}
.doc p{margin:0;font-family:var(--font-display);font-weight:200;font-size:28px;line-height:1.08;letter-spacing:-.02em;max-width:18ch}
.stamp{position:absolute;right:28px;top:26px;border:2px solid var(--purple);color:var(--purple);padding:8px 12px;font:500 12px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;opacity:.92;transform:rotate(-13deg)}
.go .stamp{animation:stamp .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes stamp{0%{opacity:0;transform:rotate(-13deg) scale(1.4)}55%{opacity:.95;transform:rotate(-13deg) scale(.95)}100%{opacity:.92;transform:rotate(-13deg) scale(1)}}
</style></head><body><div class="wrap"><div class="row"><span class="tag">Audit trail</span><button class="replay" id="b">Replay</button></div>
<div class="doc go" id="d"><p>Built to pass regulatory scrutiny.</p><span class="stamp">Passed</span></div></div>
<script>function replay(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)};document.getElementById('b').onclick=()=>replay(document.getElementById('d'),'go')</script></body></html>
